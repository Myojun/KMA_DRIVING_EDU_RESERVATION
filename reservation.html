<main id="main" class="wrap" tabindex="-1"><div class="page-heading"><p class="breadcrumb"><a href="index.html">운전교육</a><span aria-hidden="true"> / </span>예약하기</p><h1>예약하기</h1></div><noscript><p class="callout">예약에는 JavaScript가 필요합니다. 브라우저에서 JavaScript를 허용해 주세요.</p></noscript><div class="booking-layout"><section class="panel calendar-panel" aria-labelledby="calendarTitle"><h2 id="calendarTitle">교육 날짜</h2><div class="month-controls"><button id="prevMonth" type="button" aria-label="이전 달">‹</button><h3 id="currentMonth" aria-live="polite"></h3><button id="nextMonth" type="button" aria-label="다음 달">›</button></div><div id="calendar" class="calendar" aria-label="교육 날짜 선택"></div><p id="calendarMarkerStatus" class="small" role="status"></p></section><section class="panel schedule-panel" aria-labelledby="scheduleTitle"><div class="section-heading"><h2 id="scheduleTitle">교육 일정</h2><button id="scheduleRetry" class="text-button" type="button">새로고침</button></div><p id="selectedDateDisplay"></p><div class="table-scroll"><table class="schedule"><caption class="sr-only">선택 날짜의 시간 및 교육별 예약 현황</caption><thead><tr><th scope="col">시간</th><th scope="col">기능</th><th scope="col">도로기초</th><th scope="col">도봉</th></tr></thead><tbody id="scheduleBody"></tbody></table></div><p id="scheduleStatus" class="status" role="status" aria-live="polite"></p><p class="small">예약 인원 / 정원</p></section></div><section class="panel booking-form" aria-labelledby="formTitle"><h2 id="formTitle">예약 정보</h2><p class="chosen" id="selectionSummary">교육을 선택해 주세요.</p><form id="reservationForm"><div class="form-grid"><div class="field"><label for="name">이름 <span>(필수)</span></label><input id="name" name="name" autocomplete="name" required maxlength="40"></div><div class="field"><label for="phone">전화번호 <span>(필수)</span></label><input type="tel" id="phone" name="phone" autocomplete="tel" inputmode="tel" required maxlength="20"></div><div class="field"><label for="grade">학년 <span>(필수)</span></label><select id="grade" name="grade" required><option value="">선택해 주세요</option><option value="1">1학년</option><option value="2">2학년</option><option value="3">3학년</option><option value="4">4학년</option></select></div><div class="field"><label for="unit">중대 <span>(필수)</span></label><select id="unit" name="unit" required><option value="">선택해 주세요</option><option value="1">1중대</option><option value="2">2중대</option><option value="3">3중대</option><option value="4">4중대</option><option value="5">5중대</option><option value="6">6중대</option><option value="7">7중대</option><option value="8">8중대</option></select></div></div><div class="field"><label for="note">비고 <span>(선택)</span></label><textarea id="note" name="note" rows="3" maxlength="500"></textarea></div><p class="small"><a href="privacy.html">개인정보 처리방침</a></p><div class="form-actions"><button class="button primary" id="submitBtn" type="submit" disabled>예약하기</button><a href="check.html">예약조회·취소</a></div><p id="formStatus" class="status" role="status" aria-live="polite"></p></form></section></main>
